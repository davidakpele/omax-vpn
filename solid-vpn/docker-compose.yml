---
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-solidvpn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-solidvpn}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-solidvpn} -d ${POSTGRES_DB:-solidvpn}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - solid-vpn

  vpn-engine:
    build:
      context: .
      dockerfile: infrastructure/docker/vpn.Dockerfile
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    environment:
      VPN_ENGINE_CONTROL_PORT: ${VPN_ENGINE_CONTROL_PORT:-9090}
      VPN_ENGINE_CONTROL_PLANE_URL: http://api:8080
      VPN_ENGINE_CONTROL_PLANE_TOKEN: ${VPN_ENGINE_TOKEN:?VPN_ENGINE_TOKEN must be set in .env}
      VPN_ENGINE_SERVER_ID: ${VPN_ENGINE_SERVER_ID:?VPN_ENGINE_SERVER_ID must be set in .env}
      VPN_ENGINE_WIREGUARD_INTERFACE: ${VPN_ENGINE_WIREGUARD_INTERFACE:-wg0}
      VPN_ENGINE_WIREGUARD_PORT: ${VPN_ENGINE_WIREGUARD_PORT:-51820}
      VPN_ENGINE_PEER_CIDR: ${VPN_ENGINE_PEER_CIDR:-10.8.0.0/24}
      VPN_ENGINE_DNS_SERVER: ${VPN_ENGINE_DNS_SERVER:-1.1.1.1}
      VPN_ENGINE_LOG_LEVEL: ${LOG_LEVEL:-info}
      VPN_ENGINE_ENVIRONMENT: ${ENVIRONMENT:-development}
    ports:
      - "9090:9090"
      - "51820:51820/udp"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9090/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    networks:
      - solid-vpn

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      vpn-engine:
        condition: service_healthy
    environment:
      PORT: ${PORT:-8080}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgres://${POSTGRES_USER:-solidvpn}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-solidvpn}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      VPN_ENGINE_URL: ${VPN_ENGINE_URL:-http://vpn-engine:9090}
      VPN_ENGINE_TOKEN: ${VPN_ENGINE_TOKEN:?VPN_ENGINE_TOKEN must be set in .env}
      VPN_DNS: ${VPN_DNS:-1.1.1.1}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - solid-vpn

  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9091:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    networks:
      - solid-vpn

  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-changeme}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    networks:
      - solid-vpn

volumes:
  postgres_data:
  grafana_data:

networks:
  solid-vpn:
    driver: bridge
