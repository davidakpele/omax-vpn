openapi: "3.1.0"

info:
  title: Solid VPN API
  version: "1.0.0"
  description: Control plane API for Solid VPN.
  contact:
    name: Solid VPN Team

servers:
  - url: http://localhost:8080
    description: Local development
  - url: https://api.solidvpn.io
    description: Production

tags:
  - name: Health
  - name: Auth
  - name: Users
  - name: Devices
  - name: VPN
  - name: Sessions
  - name: Subscriptions

paths:

  /health:
    get:
      tags: [Health]
      summary: Liveness probe
      operationId: getHealth
      security: []
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /ready:
    get:
      tags: [Health]
      summary: Readiness probe
      operationId: getReady
      security: []
      responses:
        "200":
          description: All dependencies healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
        "503":
          description: One or more dependencies unhealthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"

  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Authenticate and receive tokens
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token
      operationId: refreshToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: New access token issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Revoke refresh token
      operationId: logout
      security:
        - BearerAuth: []
      responses:
        "204":
          description: Logged out
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/users/me:
    get:
      tags: [Users]
      summary: Get authenticated user profile
      operationId: getMe
      security:
        - BearerAuth: []
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      tags: [Users]
      summary: Update authenticated user profile
      operationId: updateMe
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: Updated user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      tags: [Users]
      summary: Delete authenticated user account
      operationId: deleteMe
      security:
        - BearerAuth: []
      responses:
        "204":
          description: Account deleted
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/devices:
    get:
      tags: [Devices]
      summary: List registered devices
      operationId: listDevices
      security:
        - BearerAuth: []
      responses:
        "200":
          description: List of devices
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Devices]
      summary: Register a new device
      operationId: createDevice
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDeviceRequest"
      responses:
        "201":
          description: Device registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/devices/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      tags: [Devices]
      summary: Get a device
      operationId: getDevice
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Device
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Devices]
      summary: Delete a device
      operationId: deleteDevice
      security:
        - BearerAuth: []
      responses:
        "204":
          description: Device deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/vpn/servers:
    get:
      tags: [VPN]
      summary: List available VPN servers
      operationId: listServers
      security:
        - BearerAuth: []
      parameters:
        - name: country
          in: query
          schema:
            type: string
            minLength: 2
            maxLength: 2
        - name: region_id
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: VPN server list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerList"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/vpn/servers/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      tags: [VPN]
      summary: Get a VPN server
      operationId: getServer
      security:
        - BearerAuth: []
      responses:
        "200":
          description: VPN server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Server"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/vpn/connect:
    post:
      tags: [VPN]
      summary: Connect to a VPN server
      operationId: connect
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectRequest"
      responses:
        "200":
          description: WireGuard configuration for the client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/vpn/disconnect:
    post:
      tags: [VPN]
      summary: Disconnect from VPN
      operationId: disconnect
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DisconnectRequest"
      responses:
        "204":
          description: Disconnected
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/vpn/config:
    get:
      tags: [VPN]
      summary: Get WireGuard config for an existing peer
      operationId: getConfig
      security:
        - BearerAuth: []
      parameters:
        - name: device_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: server_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: WireGuard config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/vpn/sessions:
    get:
      tags: [Sessions]
      summary: List VPN sessions for authenticated user
      operationId: listSessions
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [ACTIVE, ENDED, EXPIRED, ERROR]
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Session list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionList"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/vpn/sessions/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      tags: [Sessions]
      summary: Get a VPN session
      operationId: getSession
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

components:

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Missing or invalid token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Resource already exists
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: Dependency unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: DEVICE_NOT_FOUND
            message:
              type: string
              example: The requested device does not exist.

    HealthResponse:
      type: object
      required: [status, timestamp, service]
      properties:
        status:
          type: string
          example: ok
        timestamp:
          type: string
          format: date-time
        service:
          type: string
          example: vpn-api

    ReadyResponse:
      type: object
      required: [status, checks, timestamp]
      properties:
        status:
          type: string
          enum: [ready, not ready]
        checks:
          type: object
          additionalProperties:
            type: string
        timestamp:
          type: string
          format: date-time

    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 12
          maxLength: 128
          writeOnly: true

    RegisterResponse:
      type: object
      required: [user_id, email, created_at]
      properties:
        user_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        created_at:
          type: string
          format: date-time

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true

    TokenResponse:
      type: object
      required: [access_token, refresh_token, expires_in]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: integer
          description: Access token lifetime in seconds
          example: 900

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string

    RefreshResponse:
      type: object
      required: [access_token, expires_in]
      properties:
        access_token:
          type: string
        expires_in:
          type: integer
          example: 900

    UserProfile:
      type: object
      required: [id, email, role, status, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          type: string
          enum: [USER, ADMIN, SYSTEM]
        status:
          type: string
          enum: [ACTIVE, SUSPENDED, DELETED]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    UpdateUserRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254

    Device:
      type: object
      required: [id, user_id, name, public_key, status, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 100
        public_key:
          type: string
          description: WireGuard public key (base64, 44 chars)
        status:
          type: string
          enum: [ACTIVE, REVOKED]
        last_seen:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    DeviceList:
      type: object
      required: [devices]
      properties:
        devices:
          type: array
          items:
            $ref: "#/components/schemas/Device"

    CreateDeviceRequest:
      type: object
      required: [name, public_key]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        public_key:
          type: string
          minLength: 44
          maxLength: 44

    Server:
      type: object
      required: [id, name, country, city, provider, status, capacity, active_connections, wireguard_port, public_key, created_at]
      properties:
        id:
          type: string
          format: uuid
        region_id:
          type: string
          format: uuid
        name:
          type: string
        hostname:
          type: string
        public_ip:
          type: string
          format: ipv4
        country:
          type: string
          minLength: 2
          maxLength: 2
        city:
          type: string
        provider:
          type: string
        status:
          type: string
          enum: [HEALTHY, DEGRADED, MAINTENANCE, OFFLINE]
        capacity:
          type: integer
        active_connections:
          type: integer
        load:
          type: number
          format: float
          description: active_connections / capacity
        wireguard_port:
          type: integer
          example: 51820
        public_key:
          type: string
        created_at:
          type: string
          format: date-time

    ServerList:
      type: object
      required: [servers]
      properties:
        servers:
          type: array
          items:
            $ref: "#/components/schemas/Server"

    ConnectRequest:
      type: object
      required: [device_id]
      properties:
        device_id:
          type: string
          format: uuid
        server_id:
          type: string
          format: uuid
          description: If omitted, the best available server is selected automatically.

    ConnectResponse:
      type: object
      required: [session_id, wireguard_config, server_public_key, assigned_ip, dns]
      properties:
        session_id:
          type: string
          format: uuid
        wireguard_config:
          type: string
          description: Full WireGuard client config file contents
        server_public_key:
          type: string
        assigned_ip:
          type: string
          format: ipv4
        dns:
          type: string
          format: ipv4

    DisconnectRequest:
      type: object
      required: [session_id]
      properties:
        session_id:
          type: string
          format: uuid

    ConfigResponse:
      type: object
      required: [wireguard_config, server_public_key, assigned_ip, dns]
      properties:
        wireguard_config:
          type: string
        server_public_key:
          type: string
        assigned_ip:
          type: string
          format: ipv4
        dns:
          type: string
          format: ipv4

    Session:
      type: object
      required: [id, user_id, device_id, server_id, status, started_at, created_at]
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        device_id:
          type: string
          format: uuid
        server_id:
          type: string
          format: uuid
        peer_id:
          type: string
          format: uuid
          nullable: true
        status:
          type: string
          enum: [ACTIVE, ENDED, EXPIRED, ERROR]
        bytes_sent:
          type: integer
          format: int64
        bytes_received:
          type: integer
          format: int64
        started_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time

    SessionList:
      type: object
      required: [sessions, total]
      properties:
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/Session"
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
