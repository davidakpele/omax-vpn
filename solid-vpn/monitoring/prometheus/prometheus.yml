global:
  scrape_interval:     15s
  evaluation_interval: 15s
  external_labels:
    environment: development

scrape_configs:

  - job_name: "vpn-api"
    static_configs:
      - targets: ["api:8080"]
    metrics_path: /metrics

  - job_name: "vpn-engine"
    static_configs:
      - targets: ["vpn-engine:9090"]
    metrics_path: /metrics

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
